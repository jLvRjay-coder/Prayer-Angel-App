name: Deploy Daily Encouragement preview

on:
  push:
    branches: [feat/daily-encouragement-preview]
    paths:
      - .github/workflows/deploy-space-preview.yml
      - deploy_space_preview.py
      - tests/test_deploy_space_preview.py
      - app.py
      - daily_encouragement.py
      - devotional_design.py
      - tests/test_devotional_design.py
      - email_subscription.py
      - tests/test_daily_encouragement.py
      - tests/test_email_subscription.py
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angel-space-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'jLvRjay-coder/Prayer-Angel-App'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and deployment dependencies
        run: |
          pip install -r requirements.txt
          pip install huggingface-hub==2.2.0
      - name: Check preview routes, email safeguards, and deployment boundaries
        env:
          EMAIL_SIGNUPS_ENABLED: 'false'
          EMAIL_DELIVERY_ENABLED: 'false'
        run: python -m unittest discover -s tests -v
      - name: Check backend credentials without sending
        env:
          HOSTINGER_MAIL_API_TOKEN: ${{ secrets.HOSTINGER_MAIL_API_TOKEN }}
          EMAIL_SUPABASE_URL: ${{ vars.EMAIL_SUPABASE_URL }}
          EMAIL_SUPABASE_SECRET_KEY: ${{ secrets.EMAIL_SUPABASE_SECRET_KEY }}
          EMAIL_SIGNING_KEY: ${{ secrets.EMAIL_SIGNING_KEY }}
          EMAIL_SIGNUPS_ENABLED: 'false'
          EMAIL_DELIVERY_ENABLED: 'false'
        run: python email_connection_check.py
      - name: Deploy preview with email signup and sending disabled
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: python deploy_space_preview.py
