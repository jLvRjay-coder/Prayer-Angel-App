name: Email connection check (no sending)

on:
  push:
    branches: [feat/daily-encouragement-preview]
    paths:
      - .github/workflows/email-connections.yml
      - email_connection_check.py
      - email_http_probe.py
      - email_subscription.py
      - supabase_email_store.py
      - hostinger_email.py
      - tests/test_email_connection_check.py
      - tests/test_email_http_probe.py
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'jLvRjay-coder/Prayer-Angel-App'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify that probes cannot send email
        run: |
          python -m unittest discover -s tests -p test_email_connection_check.py -v
          python -m unittest discover -s tests -p test_email_http_probe.py -v
      - name: Check saved credentials without sending
        id: connections
        env:
          HOSTINGER_MAIL_API_TOKEN: ${{ secrets.HOSTINGER_MAIL_API_TOKEN }}
          EMAIL_SUPABASE_URL: ${{ vars.EMAIL_SUPABASE_URL }}
          EMAIL_SUPABASE_SECRET_KEY: ${{ secrets.EMAIL_SUPABASE_SECRET_KEY }}
          EMAIL_SIGNING_KEY: ${{ secrets.EMAIL_SIGNING_KEY }}
          EMAIL_SIGNUPS_ENABLED: 'false'
          EMAIL_DELIVERY_ENABLED: 'false'
        run: python email_connection_check.py
      - name: Collect Mail API HTTP metadata if its connection check fails
        if: failure() && steps.connections.outcome == 'failure'
        env:
          HOSTINGER_MAIL_API_TOKEN: ${{ secrets.HOSTINGER_MAIL_API_TOKEN }}
        run: python email_http_probe.py
